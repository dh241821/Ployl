{% extends "base.html" %}
{% set page = "overview" %}
{% block content %}
  <section class="card">
    <div class="card-header">
      <h2>Funkkennung oder Lager auswählen</h2>
      <p class="help">Wähle eine Funkkennung oder ein Lager, um alle zugeordneten Medizinprodukte anzuzeigen.</p>
    </div>
    <div class="card-body">
      <label class="inline">
        Standort
        <select id="location-select">
          <option value="">Bitte wählen …</option>
          {% for vehicle in vehicles %}
            <option value="{{ vehicle.id }}">{{ vehicle.radio_id }} – {{ vehicle.vehicle_type }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="table-wrapper">
        <table class="data-table" id="location-device-table">
          <thead>
            <tr>
              <th>Inventarnummer</th>
              <th>Produkt</th>
              <th>Kategorie</th>
              <th>Seriennummer</th>
              <th>Status</th>
              <th>Seit</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <script type="application/json" id="overview-data">
    {{ {
      "vehicles": [
        {
          "id": vehicle.id,
          "radio_id": vehicle.radio_id,
          "vehicle_type": vehicle.vehicle_type,
        }
        for vehicle in vehicles
      ],
      "assignments": [
        {
          "id": assignment.id,
          "vehicle_id": assignment.vehicle_id,
          "device_id": assignment.device_id,
          "assigned_from": assignment.assigned_from.isoformat() if assignment.assigned_from else None,
          "component_id": assignment.component_id,
        }
        for assignment in assignments
      ],
      "devices": [
        {
          "id": device.id,
          "inventory_number": device.inventory_number,
          "serial_number": device.serial_number,
          "status": device.status,
          "device_type": {
            "name": device.device_type.name,
            "category": device.device_type.category.name if device.device_type and device.device_type.category else None,
          },
        }
        for device in devices
      ],
    } | tojson }}
  </script>
{% endblock %}
