{% extends "base.html" %}
{% set page = "overview" %}
{% block content %}
  <section class="card">
    <div class="card-header">
      <h2>Funkkennung oder Lager auswählen</h2>
      <p class="help">Wähle eine Funkkennung oder ein Lager, um alle zugeordneten Medizinprodukte anzuzeigen.</p>
    </div>
    <div class="card-body">
      <label class="inline">
        Standort
        <select id="location-select">
          <option value="">Bitte wählen …</option>
          {% for vehicle in vehicles %}
            <option value="{{ vehicle.id }}">{{ vehicle.radio_id }} – {{ vehicle.vehicle_type }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="table-wrapper">
        <table class="data-table" id="location-device-table">
          <thead>
            <tr>
              <th>Inventarnummer</th>
              <th>Produkt</th>
              <th>Kategorie</th>
              <th>Seriennummer</th>
              <th>Status</th>
              <th>Seit</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <script type="application/json" id="overview-data">
    {{ overview_data | tojson }}
  </script>
{% endblock %}
