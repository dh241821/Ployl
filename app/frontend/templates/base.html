<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_title }}{% if title %} – {{ title }}{% endif %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="{{ page }}">
    <header class="page-header">
      <div class="container">
        <h1>{{ app_title }}</h1>
        <p>Medizinprodukteverwaltung für RTW-C/NEF und KTW Niederösterreich.</p>
        <nav class="main-nav" aria-label="Hauptnavigation">
          <a href="/"{% if page == "overview" %} aria-current="page"{% endif %}>Übersicht</a>
          <a href="/devices"{% if page == "devices" %} aria-current="page"{% endif %}>Produkte &amp; Geräte</a>
          <a href="/repairs"{% if page == "repairs" %} aria-current="page"{% endif %}>Reparaturlog</a>
          <a href="/checks/stk"{% if page == "checks-stk" %} aria-current="page"{% endif %}>STK</a>
          <a href="/checks/mtk"{% if page == "checks-mtk" %} aria-current="page"{% endif %}>MTK</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
